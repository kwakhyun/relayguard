services:
  relayguard:
    image: ${RELAYGUARD_IMAGE:-ghcr.io/kwakhyun/relayguard:0.2.0}
    ports:
      - "127.0.0.1:8810:8810"
    environment:
      RELAYGUARD_UPSTREAM_URL: ${RELAYGUARD_UPSTREAM_URL:?Set an HTTPS upstream origin}
      RELAYGUARD_UPSTREAM_TOKEN: ${RELAYGUARD_UPSTREAM_TOKEN:?Set the provider credential}
      RELAYGUARD_ADMIN_TOKEN: ${RELAYGUARD_ADMIN_TOKEN:?Set a random admin credential}
      RELAYGUARD_DB: /data/relayguard.db
      # Optional settings; empty values keep the defaults. See docs/deployment.md.
      RELAYGUARD_UPSTREAM_AUTH_HEADER: ${RELAYGUARD_UPSTREAM_AUTH_HEADER:-Authorization}
      RELAYGUARD_UPSTREAM_AUTH_SCHEME: ${RELAYGUARD_UPSTREAM_AUTH_SCHEME:-Bearer}
      RELAYGUARD_ADMIN_TOKEN_NEXT: ${RELAYGUARD_ADMIN_TOKEN_NEXT:-}
      RELAYGUARD_METRICS_TOKEN: ${RELAYGUARD_METRICS_TOKEN:-}
      RELAYGUARD_ALERT_WEBHOOK_URL: ${RELAYGUARD_ALERT_WEBHOOK_URL:-}
      RELAYGUARD_ALERT_DENY_THRESHOLD: ${RELAYGUARD_ALERT_DENY_THRESHOLD:-20}
      RELAYGUARD_ALERT_COOLDOWN_SECONDS: ${RELAYGUARD_ALERT_COOLDOWN_SECONDS:-600}
    volumes:
      - relayguard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8810/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  relayguard-data:
