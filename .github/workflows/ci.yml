name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -q
      - run: python scripts/e2e.py
      - run: python -m build --no-isolation
      - run: python scripts/wheel_smoke.py
      - name: Set up Node for console state regression tests
        if: matrix.python == '3.12'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install development-only console test dependencies
        if: matrix.python == '3.12'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify console async state transitions
        if: matrix.python == '3.12'
        run: npm test
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
